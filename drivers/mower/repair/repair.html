<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:22px 16px;background:var(--homey-background-color,#f7f8fa);color:var(--homey-text-color,#20252b)}
main{max-width:540px;margin:auto}h1{font-size:23px;margin:4px 0 10px}p{line-height:1.55}
button.item{display:block;width:100%;text-align:left;border:0;border-radius:13px;background:rgba(130,130,130,.13);color:inherit;padding:17px;margin:13px 0;cursor:pointer}
button.item strong{display:block;font-size:16px;margin-bottom:6px}button.item small{line-height:1.5;opacity:.8}
.top{display:flex;gap:6px;justify-content:end}.top button{border:1px solid #888;border-radius:8px;padding:6px 12px;background:transparent;color:inherit}
.note{font-size:12px;opacity:.75}
</style></head><body><main>
<div class="top"><button id="de">DE</button><button id="en">EN</button></div>
<h1 id="title">Manage mower</h1>
<p id="lead">Maintenance point names and account recovery. Existing mowing and garage controls are unchanged.</p>
<button class="item" onclick="Homey.showView('maintenance_settings')"><strong id="pTitle">📍 Maintenance points P1–P5</strong><small id="pHelp">Name points and select verified primary destinations, independently of Garage Mode.</small></button>
<button class="item" onclick="Homey.showView('reauth')"><strong id="aTitle">🔐 Reconnect account</strong><small id="aHelp">Renew manufacturer credentials without deleting the mower or its Flows.</small></button>
<p class="note" id="note">Native zone editing and garage configuration remain in their existing upstream locations. They are not changed in this small PR.</p>
<button class="item" onclick="Homey.done()"><strong id="done">Done</strong></button>
</main><script>
(function(){
const dict={
en:['Manage mower','Maintenance point names and account recovery. Existing mowing and garage controls are unchanged.','📍 Maintenance points P1–P5','Name points and select verified primary destinations, independently of Garage Mode.','🔐 Reconnect account','Renew manufacturer credentials without deleting the mower or its Flows.','Native zone editing and garage configuration remain in their existing upstream locations. They are not changed in this small PR.','Done'],
de:['Mäher verwalten','Wartungspunkte und Kontoverbindung verwalten. Bestehende Mäh- und Garagenfunktionen bleiben unverändert.','📍 Wartungspunkte P1–P5','Punkte benennen und bestätigte Hauptpunkte auswählen – unabhängig vom Garagenmodus.','🔐 Verbindung neu anmelden','Hersteller-Zugangsdaten erneuern, ohne Mäher oder Flows zu löschen.','Native Sperrzonen und Garagenoptionen bleiben vorerst an den bisherigen Stellen. Diese kleine Erweiterung verändert sie nicht.','Fertig']};
const ids=['title','lead','pTitle','pHelp','aTitle','aHelp','note','done'];
function apply(lang){const l=lang==='de'?'de':'en';document.documentElement.lang=l;ids.forEach((id,i)=>document.getElementById(id).textContent=dict[l][i]);try{Homey.setTitle(dict[l][0]);document.getElementById('title').hidden=true;}catch(_){} }
['de','en'].forEach(lang=>document.getElementById(lang).onclick=()=>{apply(lang);try{Homey.emit('set_repair_ui_language',{language:lang})}catch(_){}});
try{Homey.emit('get_repair_ui_language',{},(error,lang)=>apply(error?'en':lang))}catch(_){apply('en')}
try{Homey.ready?.()}catch(_){}
})();
</script></body></html>
